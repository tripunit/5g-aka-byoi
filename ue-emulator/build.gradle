plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation        project(':5g-aka-byoi:shared')
    implementation        'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation        'io.vertx:vertx-web:4.4.4'
    implementation        'io.vertx:vertx-web-templ-handlebars:4.4.4'
    implementation        'org.apache.logging.log4j:log4j-core:2.20.0'
    implementation        'org.bouncycastle:bcprov-jdk18on:1.75'
    testImplementation    'org.testng:testng:7.8.0'
}

application {
    mainClass                 = 'io.vertx.core.Launcher'
    applicationDefaultJvmArgs = ['-Dio.vertx.web.route.param.extended-pattern=true']
}

test {
    useTestNG()
}
